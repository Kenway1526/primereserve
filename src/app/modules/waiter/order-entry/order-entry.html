<div class="order-container">
  <header class="order-header">
    <button (click)="volver()" class="btn-back">← Volver al Mapa</button>
    <h2>Nueva Orden - Mesa {{ numeroMesa }}</h2>
  </header>

  <div class="order-layout">
    <section class="menu-grid">
      <div *ngIf="isLoading" class="loader">Validando stock...</div>
      
      <div *ngFor="let item of menuItems" 
           class="menu-card" 
           (click)="agregarAlCarrito(item)">
        <div class="card-img">
          <img [src]="item.imagenUrl || 'https://via.placeholder.com/150'" alt="platillo">
        </div>
        <div class="card-info">
          <h4>{{ item.nombre }}</h4>
          <span class="price">${{ item.precio }}</span>
        </div>
      </div>
    </section>

    <aside class="order-summary">
      <h3>Resumen de Cuenta</h3>
      <div class="items-list">
        <div *ngFor="let c of carrito" class="item-row">
          <span class="qty">{{ c.cantidad }}x</span>
          <span class="name">{{ c.nombre }}</span>
          <span class="subtotal">${{ c.precio * c.cantidad }}</span>
        </div>
      </div>

      <div class="summary-footer">
        <div class="total-line">
          <span>TOTAL:</span>
          <strong>${{ total }}</strong>
        </div>
        <button class="btn-confirm" 
                [disabled]="carrito.length === 0 || isLoading"
                (click)="confirmarPedido()">
          Enviar a Cocina
        </button>
      </div>
    </aside>
  </div>
</div>
